name: Build installable APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK; only the platform and build
      # tools matter. sdkmanager is not always on PATH, so fall back to the SDK dir.
      - name: Install platform 35 and build tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK at $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found" >&2; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      # Only the tail is not enough: javac errors can sit thousands of lines above
      # the stack traces. Post a filtered extract, plus the raw tail as a fallback.
      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, re
          log = open('build.log', errors='replace').read()
          lines = log.splitlines()
          keep = []
          matchers = ('error:', 'e: ', 'What went wrong', 'FAILURE:', 'Caused by:',
                      'Execution failed', '> Task :', 'AAPT', 'aapt2', 'Duplicate class',
                      'cannot find symbol', 'package ', 'is not abstract')
          for i, line in enumerate(lines):
              if any(m in line for m in matchers) or re.match(r'\s+\S+\.java:\d+: ', line):
                  keep.append(line)
                  keep.extend(lines[i + 1:i + 4])  # symbol:, location:, source line
          body = "Gradle build failed.\n\nFiltered output:\n\n```\n" + "\n".join(keep[:400])[-50000:]
          body += "\n```\n\nLast 60 lines:\n\n```\n" + "\n".join(lines[-60:])[-8000:] + "\n```"
          json.dump({"body": body}, open('/tmp/payload.json', 'w'))
          PY
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/payload.json || true

      - name: Keep the raw build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release assets are public downloads; workflow artifacts need a login.
      # This release file is what you tap on the phone.
      - name: Publish APK to the apk-latest release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ARCHIVE-debug.apk
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest \
                 --title "ARCHIVE — latest debug build" \
                 --notes "Debug APK built automatically from commit ${{ github.sha }}. Tap the APK on your phone to install."
          gh release upload apk-latest ARCHIVE-debug.apk --clobber
