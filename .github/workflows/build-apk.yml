name: Build installable APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 35 and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A release asset is publicly downloadable, unlike a workflow artifact
      # which needs a GitHub login. This is the file you tap on the phone.
      - name: Publish APK to the "apk-latest" release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP=app/build/outputs/apk/debug/app-debug.apk
          cp "$APP" ARCHIVE-debug.apk
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest \
                 --title "ARCHIVE — latest debug build" \
                 --notes "Debug APK built automatically from \`${{ github.sha }}\` on $(date -u +%Y-%m-%d). Tap the APK on your phone to install."
          gh release upload apk-latest ARCHIVE-debug.apk --clobber
